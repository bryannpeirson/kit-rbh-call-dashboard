<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIT &amp; RBH Call Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#006271;--teal-lt:#e4eff0;--gold:#e2bc5c;--gold-lt:#fdf6e3;--dark:#00272d;--red:#c0392b;--red-lt:#fee2e2;--amber:#f59e0b;--amber-lt:#fef3c7;--green:#16a34a;--green-lt:#dcfce7;--border:#e4e8ec;--bg:#f4f6f8;--white:#fff;--text:#1a2a2d;--muted:#6b7f86;--font:'Montserrat',sans-serif;
--kit:#1d6fa5;--kit-lt:#dbeafe;--rbh:#b45309;--rbh-lt:#fef3c7}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--dark);padding:22px 32px;display:flex;align-items:center;gap:16px}
.header-title{font-size:18px;font-weight:800;color:#fff;letter-spacing:.06em;text-transform:uppercase}
.header-sub{font-size:10px;font-weight:600;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.status-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:rgba(226,188,92,.15);border:1px solid rgba(226,188,92,.35);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:700;color:var(--gold);flex-shrink:0}
.page{padding:22px 32px 48px;max-width:1200px;margin:0 auto}

/* Site selector */
.site-selector{display:flex;gap:10px;margin-bottom:22px;align-items:center}
.site-btn{padding:8px 22px;border-radius:8px;border:2px solid var(--border);background:var(--white);font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.14s;color:var(--muted)}
.site-btn:hover{border-color:var(--teal)}
.site-btn.active-kit{background:var(--kit);border-color:var(--kit);color:#fff}
.site-btn.active-rbh{background:var(--rbh);border-color:var(--rbh);color:#fff}
.site-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* Summary strip */
.summary-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.sc{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:13px 16px}
.sc.kit{border-top:3px solid var(--kit)}.sc.rbh{border-top:3px solid var(--rbh)}
.sc-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
.sc-value{font-size:26px;font-weight:800;line-height:1}
.sc-value.red{color:var(--red)}.sc-value.teal{color:var(--teal)}.sc-value.green{color:var(--green)}
.sc-value.kit{color:var(--kit)}.sc-value.rbh{color:var(--rbh)}
.sc-sub{font-size:10px;color:var(--muted);margin-top:4px;font-weight:500}

/* Week tabs */
.week-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
.week-tab{background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.12s;text-align:left}
.week-tab:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(0,39,45,.1)}
.week-tab.active-kit{background:var(--kit);border-color:var(--kit)}
.week-tab.active-rbh{background:var(--rbh);border-color:var(--rbh)}
.wt-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.week-tab.active-kit .wt-label,.week-tab.active-rbh .wt-label{color:rgba(255,255,255,.6)}
.wt-dates{font-size:13px;font-weight:800;color:var(--text);line-height:1.2}
.week-tab.active-kit .wt-dates,.week-tab.active-rbh .wt-dates{color:#fff}
.wt-stats{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.wt-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px}
.chip-red{background:var(--red-lt);color:#991b1b}.chip-amber{background:var(--amber-lt);color:#92400e}.chip-green{background:var(--green-lt);color:#166534}.chip-teal{background:var(--teal-lt);color:var(--teal)}
.chip-kit{background:var(--kit-lt);color:var(--kit)}.chip-rbh{background:var(--rbh-lt);color:var(--rbh)}

/* Trend */
.trend-panel{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:22px}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);background:#fafbfc}
.panel-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:7px}
.panel-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.panel-meta{font-size:10px;font-weight:600;color:var(--muted)}
.panel-body{padding:16px}
.trend-wrap{position:relative;height:180px}

/* Section label */
.section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Day grid */
.day-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:22px}
.day-btn{background:var(--white);border:1.5px solid var(--border);border-radius:8px;padding:8px 4px;cursor:pointer;text-align:center;transition:.12s}
.day-btn:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(0,39,45,.1)}
.day-btn.active-kit{background:var(--kit);border-color:var(--kit)}
.day-btn.active-rbh{background:var(--rbh);border-color:var(--rbh)}
.day-btn.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.db-date{font-size:10px;font-weight:700;color:var(--text);line-height:1.2}
.day-btn.active-kit .db-date,.day-btn.active-rbh .db-date{color:#fff}
.db-dow{font-size:8px;font-weight:600;color:var(--muted);margin-top:1px;letter-spacing:.04em}
.day-btn.active-kit .db-dow,.day-btn.active-rbh .db-dow{color:rgba(255,255,255,.7)}
.db-nc{font-size:9px;font-weight:800;margin-top:5px;padding:1px 5px;border-radius:8px;display:inline-block}
.nc-red{background:var(--red-lt);color:#991b1b}.nc-amber{background:var(--amber-lt);color:#92400e}.nc-green{background:var(--green-lt);color:#166534}

/* Day detail */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:var(--white);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.chart-wrap{position:relative;height:190px}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;padding:9px 16px;border-top:1px solid var(--border);background:#fafbfc}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.b-c{background:var(--green-lt);color:#166534}.d-c{background:var(--green)}
.b-vm{background:var(--amber-lt);color:#92400e}.d-vm{background:var(--amber)}
.b-a{background:var(--red-lt);color:#991b1b}.d-a{background:var(--red)}

/* Queue table */
.q-table{width:100%;border-collapse:collapse;font-size:11px}
.q-table thead tr{background:var(--dark)}
.q-table thead th{padding:8px 12px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;white-space:nowrap}
.q-table thead th.r{text-align:right}
.q-table tbody tr{border-bottom:1px solid var(--border)}
.q-table tbody tr:last-child{border-bottom:none}
.q-table tbody tr:hover{background:#f0f8f9}
.q-table tbody td{padding:8px 12px;color:var(--text);font-weight:500;vertical-align:middle}
.q-table tbody td.r{text-align:right}
.nc-pill{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700}
.pill-red{background:var(--red-lt);color:#991b1b}.pill-amber{background:var(--amber-lt);color:#92400e}.pill-green{background:var(--green-lt);color:#166534}
.bar-wrap{width:60px;height:5px;background:var(--border);border-radius:99px;overflow:hidden;display:inline-block;margin-right:5px;vertical-align:middle}
.bar-fill{height:100%;border-radius:99px}
.day-note{font-size:11px;color:var(--muted);border-left:3px solid var(--gold);padding:8px 12px;background:var(--gold-lt);border-radius:0 6px 6px 0;margin-bottom:14px;font-weight:500;line-height:1.6}
.day-note strong{color:var(--text)}
.footer{text-align:center;font-size:10px;color:var(--muted);padding-top:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-top:1px solid var(--border);margin-top:8px}
@media(max-width:700px){.two-col,.summary-row,.week-tabs{grid-template-columns:1fr}.day-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.page,.header{padding-left:16px;padding-right:16px}}
</style>
</head>

const RBH_META=[{"label":"06-09 \u2013 06-13","total":113,"nc":25,"nc_pct":22},{"label":"06-14 \u2013 06-20","total":168,"nc":10,"nc_pct":6},{"label":"06-21 \u2013 06-27","total":157,"nc":7,"nc_pct":4},{"label":"06-28 \u2013 07-04","total":291,"nc":42,"nc_pct":14},{"label":"07-05 \u2013 07-11","total":229,"nc":28,"nc_pct":12},{"label":"07-12 \u2013 07-18","total":220,"nc":42,"nc_pct":19},{"label":"07-19 \u2013 07-25","total":224,"nc":18,"nc_pct":8},{"label":"07-26 \u2013 08-01","total":243,"nc":40,"nc_pct":16},{"label":"08-02 \u2013 08-08","total":210,"nc":23,"nc_pct":11},{"label":"08-09 \u2013 08-15","total":281,"nc":47,"nc_pct":17},{"label":"08-16 \u2013 08-22","total":219,"nc":17,"nc_pct":8},{"label":"08-23 \u2013 08-29","total":150,"nc":26,"nc_pct":17},{"label":"08-30 \u2013 09-05","total":197,"nc":40,"nc_pct":20},{"label":"09-06 \u2013 09-12","total":132,"nc":52,"nc_pct":39},{"label":"09-13 \u2013 09-19","total":95,"nc":24,"nc_pct":25},{"label":"09-20 \u2013 09-26","total":68,"nc":17,"nc_pct":25},{"label":"09-27 \u2013 10-03","total":61,"nc":18,"nc_pct":30},{"label":"10-04 \u2013 10-10","total":75,"nc":24,"nc_pct":32},{"label":"10-12 \u2013 10-17","total":45,"nc":12,"nc_pct":27},{"label":"10-18 \u2013 10-24","total":20,"nc":5,"nc_pct":25},{"label":"10-26 \u2013 10-29","total":8,"nc":4,"nc_pct":50}];
const KIT_STATS={"total":8017,"nc":968,"completed":7049,"nc_pct":12,"days":142,"crisis":10};
const RBH_STATS={"total":3206,"nc":521,"completed":2685,"nc_pct":16,"days":139,"crisis":19};

const HL={7:'7a',8:'8a',9:'9a',10:'10a',11:'11a',12:'12p',13:'1p',14:'2p',15:'3p',16:'4p',17:'5p',18:'6p',19:'7p'};

let activeSite='KIT', activeWeek=0, activeDay=0;
let tChart=null, hChart=null, ncChart=null;

function ncClass(r){return r>=40?'nc-red':r>=20?'nc-amber':'nc-green'}
function pillClass(r){return r>=40?'pill-red':r>=20?'pill-amber':'pill-green'}
function barColor(r){return r>=40?'#c0392b':r>=20?'#f59e0b':'#16a34a'}
function chipClass(r){return r>=40?'chip-red':r>=20?'chip-amber':'chip-green'}
function siteColor(){return activeSite==='KIT'?'var(--kit)':'var(--rbh)'}
function activeClass(){return 'active-'+activeSite.toLowerCase()}
function weeks(){return activeSite==='KIT'?KIT_WEEKS:RBH_WEEKS}
function meta(){return activeSite==='KIT'?KIT_META:RBH_META}
function stats(){return activeSite==='KIT'?KIT_STATS:RBH_STATS}

function switchSite(site){
  activeSite=site; activeWeek=0; activeDay=0;
  document.getElementById('btnKIT').className='site-btn'+(site==='KIT'?' active-kit':'');
  document.getElementById('btnRBH').className='site-btn'+(site==='RBH'?' active-rbh':'');
  document.getElementById('trendDot').style.background=siteColor();
  buildSummary(); buildWeekTabs(); buildTrend(); buildDayGrid(); buildDay();
}

function buildSummary(){
  const s=stats(); const cls=activeSite.toLowerCase();
  const crisisDates=weeks().flat().filter(d=>d.nc_pct>=40).map(d=>d.date.slice(5)).join(' · ');
  document.getElementById('summaryRow').innerHTML=
    '<div class="sc '+cls+'"><div class="sc-label">Total calls</div><div class="sc-value '+cls+'">'+s.total.toLocaleString()+'</div><div class="sc-sub">'+s.days+' days tracked</div></div>'+
    '<div class="sc '+cls+'"><div class="sc-label">Completed</div><div class="sc-value green">'+s.completed.toLocaleString()+'</div><div class="sc-sub">'+(100-s.nc_pct)+'% completion rate</div></div>'+
    '<div class="sc '+cls+'"><div class="sc-label">Not completed</div><div class="sc-value red">'+s.nc.toLocaleString()+'</div><div class="sc-sub">'+s.nc_pct+'% NC rate overall</div></div>'+
    '<div class="sc '+cls+'"><div class="sc-label">Crisis days (≥40% NC)</div><div class="sc-value red">'+s.crisis+'</div><div class="sc-sub" style="word-break:break-word">'+crisisDates+'</div></div>';
}

function buildWeekTabs(){
  const el=document.getElementById('weekTabs');
  el.innerHTML='';
  meta().forEach((m,i)=>{
    const t=document.createElement('div');
    t.className='week-tab'+(i===activeWeek?' '+activeClass():'');
    t.innerHTML='<div class="wt-label">Week '+(i+1)+'</div>'+
      '<div class="wt-dates">'+m.label+'</div>'+
      '<div class="wt-stats">'+
        '<span class="wt-chip chip-teal">'+m.total+' calls</span>'+
        '<span class="wt-chip '+chipClass(m.nc_pct)+'">'+m.nc_pct+'% NC</span>'+
      '</div>';
    t.onclick=()=>switchWeek(i);
    el.appendChild(t);
  });
}

function buildTrend(){
  const week=weeks()[activeWeek];
  const labels=week.map(d=>d.date.slice(5)+' '+d.dow.slice(0,3));
  const rates=week.map(d=>d.nc_pct);
  const colors=rates.map(r=>r>=40?'#c0392b':r>=20?'#f59e0b':'#22c55e');
  if(tChart)tChart.destroy();
  tChart=new Chart(document.getElementById('trendChart'),{type:'bar',
    data:{labels,datasets:[{data:rates,backgroundColor:colors,borderRadius:4,borderWidth:0,borderColor:'transparent'}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:i=>{const d=week[i[0].dataIndex];return d.dow+' '+d.date;},
        label:i=>'NC: '+i.raw+'% ('+week[i.dataIndex].nc+' of '+week[i.dataIndex].total+' calls)'
      }}},
      onClick:(_,els)=>{if(els.length)switchDay(els[0].index);},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9,family:'Montserrat',weight:'600'},color:'#6b7f86'}},
        y:{max:100,grid:{color:'rgba(0,39,45,.05)'},ticks:{font:{size:9,family:'Montserrat',weight:'600'},color:'#6b7f86',callback:v=>v+'%'}}
      }
    }
  });
}

function buildDayGrid(){
  const week=weeks()[activeWeek];
  const grid=document.getElementById('dayGrid');
  grid.innerHTML='';
  const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const startDow=DOW.indexOf(week[0].dow);
  for(let i=0;i<startDow;i++){const e=document.createElement('div');e.className='day-btn empty';grid.appendChild(e);}
  week.forEach((d,i)=>{
    const btn=document.createElement('div');
    btn.className='day-btn'+(i===activeDay?' '+activeClass():'');
    btn.innerHTML='<div class="db-date">'+d.date.slice(5)+'</div>'+
      '<div class="db-dow">'+d.dow.slice(0,3).toUpperCase()+'</div>'+
      '<div class="db-nc '+ncClass(d.nc_pct)+'">'+d.nc_pct+'%</div>';
    btn.onclick=()=>switchDay(i);
    grid.appendChild(btn);
  });
  const endDow=DOW.indexOf(week[week.length-1].dow);
  for(let i=endDow+1;i<7;i++){const e=document.createElement('div');e.className='day-btn empty';grid.appendChild(e);}
}

function buildDay(){
  const d=weeks()[activeWeek][activeDay];
  if(!d){document.getElementById('dayDetail').innerHTML='';return;}
  const hours=Object.keys(d.hours).map(Number).filter(h=>d.hours[h]>0).sort((a,b)=>a-b);
  const pct=v=>d.total?Math.round(v/d.total*100):0;
  const wh=Object.entries(d.hours).sort((a,b)=>b[1]-a[1])[0];
  const whNC=(d.h_voicemail[wh[0]]||0)+(d.h_abandoned[wh[0]]||0);
  const tone=d.nc_pct>=50?'🔴 <strong>Critical</strong>':d.nc_pct>=30?'🟠 <strong>Elevated</strong>':'🟢 <strong>Acceptable</strong>';
  const noteQpart=d.queues&&d.queues.length?' Top queue: '+d.queues[0].name+' — '+d.queues[0].nc+' NC of '+d.queues[0].total+' calls ('+Math.round(d.queues[0].nc/d.queues[0].total*100)+'% NC).':'';
  const note=tone+' — '+d.nc_pct+'% NC rate. Busiest hour: '+(HL[wh[0]]||wh[0])+' ('+wh[1]+' calls, '+whNC+' not completed).'+noteQpart;
  let qrows='';
  if(d.queues)d.queues.forEach(q=>{
    const r=q.total?Math.round(q.nc/q.total*100):0;
    qrows+='<tr><td><strong>'+q.name+'</strong></td><td class="r">'+q.total+'</td><td class="r">'+q.completed+'</td><td class="r">'+q.voicemail+'</td><td class="r">'+q.abandoned+'</td><td><span class="bar-wrap"><span class="bar-fill" style="width:'+Math.min(r,100)+'%;background:'+barColor(r)+'"></span></span><span class="nc-pill '+pillClass(r)+'">'+r+'%</span></td></tr>';
  });
  const sc=siteColor();
  document.getElementById('dayDetail').innerHTML=
    '<div class="day-note">'+note+'</div>'+
    '<div class="two-col">'+
      '<div class="panel"><div class="panel-header"><div class="panel-title"><span class="panel-dot" style="background:'+sc+'"></span>All calls by hour</div><div class="panel-meta">'+d.total+' calls</div></div><div class="panel-body"><div class="chart-wrap"><canvas id="hChart"></canvas></div></div><div class="badge-row"><span class="badge b-c"><span class="dot d-c"></span>Completed: '+d.completed+' ('+pct(d.completed)+'%)</span><span class="badge b-vm"><span class="dot d-vm"></span>Voicemail/OVF: '+d.voicemail+' ('+pct(d.voicemail)+'%)</span><span class="badge b-a"><span class="dot d-a"></span>Abandoned: '+d.abandoned+' ('+pct(d.abandoned)+'%)</span></div></div>'+
      '<div class="panel"><div class="panel-header"><div class="panel-title"><span class="panel-dot" style="background:var(--red)"></span>Not completed by hour</div><div class="panel-meta">'+d.nc+' calls · '+d.nc_pct+'% NC</div></div><div class="panel-body"><div class="chart-wrap"><canvas id="ncChart"></canvas></div></div><div class="badge-row"><span class="badge b-vm"><span class="dot d-vm"></span>Voicemail/OVF: '+d.voicemail+'</span><span class="badge b-a"><span class="dot d-a"></span>Abandoned: '+d.abandoned+'</span></div></div>'+
    '</div>'+
    (d.queues&&d.queues.length?'<div class="panel" style="margin-bottom:0"><div class="panel-header"><div class="panel-title"><span class="panel-dot" style="background:var(--gold)"></span>Queue breakdown</div><div class="panel-meta">'+d.queues.length+' queue'+(d.queues.length!==1?'s':'')+'</div></div><table class="q-table"><thead><tr><th>Queue</th><th class="r">Total</th><th class="r">Completed</th><th class="r">Voicemail/OVF</th><th class="r">Abandoned</th><th>NC Rate</th></tr></thead><tbody>'+qrows+'</tbody></table></div>':'');

  const chartOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{font:{size:9,family:'Montserrat'},boxWidth:10,padding:8}}},scales:{x:{grid:{display:false},ticks:{font:{size:9,family:'Montserrat',weight:'600'},color:'#6b7f86'},stacked:true},y:{grid:{color:'rgba(0,39,45,.05)'},ticks:{font:{size:9,family:'Montserrat',weight:'600'},color:'#6b7f86'},stacked:true}}};
  if(hChart)hChart.destroy();
  if(ncChart)ncChart.destroy();
  hChart=new Chart(document.getElementById('hChart'),{type:'bar',data:{labels:hours.map(h=>HL[h]||h),datasets:[{label:'Completed',data:hours.map(h=>d.h_completed[h]||0),backgroundColor:'#16a34a',borderRadius:3,stack:'s'},{label:'Voicemail/OVF',data:hours.map(h=>d.h_voicemail[h]||0),backgroundColor:'#f59e0b',stack:'s'},{label:'Abandoned',data:hours.map(h=>d.h_abandoned[h]||0),backgroundColor:'#c0392b',stack:'s'}]},options:chartOpts});
  ncChart=new Chart(document.getElementById('ncChart'),{type:'bar',data:{labels:hours.map(h=>HL[h]||h),datasets:[{label:'Voicemail/OVF',data:hours.map(h=>d.h_voicemail[h]||0),backgroundColor:'#f59e0b',borderRadius:3,stack:'s'},{label:'Abandoned',data:hours.map(h=>d.h_abandoned[h]||0),backgroundColor:'#c0392b',stack:'s'}]},options:chartOpts});
  if(tChart){tChart.data.datasets[0].borderWidth=weeks()[activeWeek].map((_,i)=>i===activeDay?3:0);tChart.data.datasets[0].borderColor=weeks()[activeWeek].map((_,i)=>i===activeDay?'#fff':'transparent');tChart.update('none');}
}

function switchDay(i){
  activeDay=i;
  document.querySelectorAll('.day-btn').forEach((b,j)=>{b.classList.remove('active-kit','active-rbh');if(j===i)b.classList.add(activeClass());});
  buildDay();
  document.getElementById('dayDetail').scrollIntoView({behavior:'smooth',block:'start'});
}

function switchWeek(i){
  activeWeek=i; activeDay=0;
  document.querySelectorAll('.week-tab').forEach((t,j)=>{t.classList.remove('active-kit','active-rbh');if(j===i)t.classList.add(activeClass());});
  buildTrend(); buildDayGrid(); buildDay();
}

buildSummary(); buildWeekTabs(); buildTrend(); buildDayGrid(); buildDay();
</script>
</body>
